<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepHaus</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0c0e12;
        --fg: #f4f5f7;
        --muted: #9aa3b2;
        --accent: #6c8cff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f8fa;
          --fg: #101828;
          --muted: #5b6474;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-app-region: drag;
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        -webkit-app-region: no-drag;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border-radius: 10px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin: 0 auto;
        background: linear-gradient(135deg, #6c8cff, #8a5cff);
      }
      .status {
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <h1>Connect once to set up offline study</h1>
        <p>
          DeepHaus keeps your decks on this computer after the first sign-in. Connect to the internet to finish setting
          up, then studying works offline.
        </p>
        <button id="retry" type="button">Try again</button>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </main>
    <script>
      const button = document.getElementById("retry");
      const status = document.getElementById("status");
      function retry() {
        button.disabled = true;
        status.textContent = "Connecting…";
        window.deephausDesktopShell?.retry();
        setTimeout(() => {
          button.disabled = false;
          status.textContent = navigator.onLine ? "" : "Still offline.";
        }, 4000);
      }
      button.addEventListener("click", retry);
      window.addEventListener("online", retry);
      if (navigator.onLine) status.textContent = "";
      else status.textContent = "You are offline.";
    </script>
  </body>
</html>
