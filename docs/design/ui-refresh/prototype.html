<!doctype html><html lang="en" data-theme="light" data-accent="teal"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepHaus UI refresh</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Quicksand:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"><style>
/* DeepHaus UI refresh prototype. Design tokens are the proposal; everything else is scaffolding. */
:root{
  --canvas:#FAF9F5; --rail:#F3F1EA; --surface:#FFFFFF; --sunken:#F3F1EA;
  --hover:rgba(46,40,28,.055); --active:rgba(46,40,28,.09);
  --line:rgba(46,40,28,.12); --line-2:rgba(46,40,28,.22);
  --ink:#1F1E1B; --ink-2:#55534B; --ink-3:#716E65; --on-ink:#FAF9F5;
  --accent:#2C7A7B; --accent-h:#236566; --accent-ink:#1F6768; --accent-soft:rgba(44,122,123,.11); --on-accent:#fff;
  --due:#A8571F; --due-dot:#C9702E; --danger:#B3402A; --danger-soft:rgba(179,64,42,.09); --ok:#2F7A52;
  --g1:#B8452C; --g2:#DE9A80; --g3:#5DB3AF; --g4:#1F7A78;
  --h0:rgba(46,40,28,.06); --h1:#CDE6E3; --h2:#94CBC7; --h3:#4FA5A2; --h4:#1F7A78;
  --p1:#F6E3C2; --p2:#EDC88A; --p3:#DFA24E; --p4:#C9702E;
  --sh-1:0 1px 2px rgba(46,40,28,.05),0 2px 10px rgba(46,40,28,.04);
  --sh-2:0 2px 4px rgba(46,40,28,.05),0 10px 30px rgba(46,40,28,.08);
  --sh-3:0 6px 16px rgba(46,40,28,.08),0 24px 60px rgba(46,40,28,.14);
  --scrim:rgba(38,34,26,.34);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --brand:"Quicksand",var(--sans);
}
[data-theme=dark]{
  --canvas:#262523; --rail:#1E1D1B; --surface:#302F2C; --sunken:#1E1D1B;
  --hover:rgba(240,235,220,.065); --active:rgba(240,235,220,.11);
  --line:rgba(240,235,220,.12); --line-2:rgba(240,235,220,.24);
  --ink:#F3F1EA; --ink-2:#C6C3B9; --ink-3:#9D9A90; --on-ink:#1F1E1B;
  --accent:#4FB3AE; --accent-h:#6CC6C1; --accent-ink:#7AD0CB; --accent-soft:rgba(79,179,174,.15); --on-accent:#10211F;
  --due:#E6A36C; --due-dot:#D98A4A; --danger:#EC8B73; --danger-soft:rgba(236,139,115,.12); --ok:#7CC49B;
  --g1:#E0683F; --g2:#A8644C; --g3:#3F8F8C; --g4:#6FD0CB;
  --h0:rgba(240,235,220,.07); --h1:#2B4A48; --h2:#2F6E6B; --h3:#3F9C98; --h4:#7AD0CB;
  --p1:#4A3B24; --p2:#6E5429; --p3:#A67A33; --p4:#D98A4A;
  --sh-1:0 1px 2px rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.14);
  --sh-2:0 2px 4px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.26);
  --sh-3:0 6px 16px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.42);
  --scrim:rgba(10,9,8,.55);
}
[data-accent=clay]{--accent:#C2593A;--accent-h:#A94A2E;--accent-ink:#A94A2E;--accent-soft:rgba(194,89,58,.11)}
[data-accent=clay][data-theme=dark]{--accent:#DC7A58;--accent-h:#E8916F;--accent-ink:#EDA286;--accent-soft:rgba(220,122,88,.16);--on-accent:#2A1610}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:400 14px/21px var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}
.sp{flex:1}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.small{font-size:13px;line-height:19px} .tiny{font-size:12px;line-height:17px}
.serif{font-family:var(--serif)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnum{font-variant-numeric:tabular-nums lining-nums}

/* Shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh;background:var(--canvas)}
.shell.rail-only{grid-template-columns:60px minmax(0,1fr)}
.side{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 8px 8px}
.side-top{display:flex;align-items:center;height:40px;padding:0 6px 0 8px;gap:9px}
.wordmark{font:700 17px/1 var(--brand);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;color:var(--ink-2);font-size:14px;width:100%;text-align:left}
.nav a:hover,.nav button:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--active);color:var(--ink);font-weight:500}
.nav i{font-size:17px;width:18px;text-align:center;color:var(--ink-3)}
.nav a.on i{color:var(--ink)}
.nav .newdeck{color:var(--ink);font-weight:500;margin-bottom:5px}
.nav .newdeck b{display:grid;place-items:center;width:22px;height:22px;margin-left:-2px;margin-right:-2px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:400}
.nav .newdeck b i{color:inherit;font-size:15px}
.nav kbd{margin-left:auto}
.side-label{padding:18px 10px 6px;font-size:12px;color:var(--ink-3)}
.recents{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.recents a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px}
.recents a:hover{background:var(--hover);color:var(--ink)}
.recents a span:first-child{flex:1;min-width:0}
.recents .n{font-size:12px;color:var(--ink-3)}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;width:100%;text-align:left}
.me:hover,.me.on{background:var(--hover)}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);font:500 12px/1 var(--sans);flex:none}
.rail-only .side{align-items:center;padding:10px 0 8px}
.rail-only .nav a,.rail-only .nav button{width:38px;justify-content:center;padding:0}
.main{min-width:0;min-height:0;overflow:auto;position:relative}
.page{max-width:1080px;margin:0 auto;padding:44px 48px 96px}
.page.narrow{max-width:816px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.title{font:400 34px/42px var(--serif);letter-spacing:-.012em}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;margin-bottom:12px}
.crumb a:hover{color:var(--ink)}

/* Primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-weight:500;font-size:13.5px;white-space:nowrap;border:1px solid transparent;transition:background .12s,border-color .12s}
.btn i{font-size:16px}
.btn-p{background:var(--ink);color:var(--on-ink)} .btn-p:hover{opacity:.88}
.btn-s{background:var(--surface);border-color:var(--line-2);color:var(--ink)} .btn-s:hover{background:var(--sunken)}
.btn-g{color:var(--ink-2)} .btn-g:hover{background:var(--hover);color:var(--ink)}
.btn-a{background:var(--accent);color:var(--on-accent)} .btn-a:hover{background:var(--accent-h)}
.btn-d{background:var(--danger);color:#fff}
.btn-lg{height:42px;padding:0 18px;font-size:14px;border-radius:11px}
.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--ink-2);font-size:17px;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn.bordered{border:1px solid var(--line-2);background:var(--surface)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--hover);color:var(--ink-3);font:500 11px/1 var(--sans)}
.btn-p kbd{background:rgba(255,255,255,.16);color:inherit}
[data-theme=dark] .btn-p kbd{background:rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--hover);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent-ink)}
.pill.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.pill i{font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
.dot.due{background:var(--due-dot)} .dot.new{background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;white-space:nowrap}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:transparent}
.chip i{font-size:15px}
.input{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}
.input i{color:var(--ink-3);font-size:16px}
.input.ph{color:var(--ink-3)}
.input:focus-within{border-color:var(--ink-3)}
textarea.input{height:auto;padding:10px 12px;line-height:21px;resize:none;display:block}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.help{font-size:12.5px;line-height:18px;color:var(--ink-3);margin-top:6px}
.surface{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.toggle{width:36px;height:21px;border-radius:999px;background:var(--line-2);position:relative;flex:none;display:inline-block}
.toggle::after{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)} .toggle.on::after{left:17px}
.check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:13px;color:transparent}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--hover);border-radius:10px}
.seg button{height:28px;padding:0 10px;border-radius:7px;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
[data-theme=dark] .seg button.on{background:rgba(240,235,220,.14)}
.slider{height:4px;border-radius:9px;background:var(--line);position:relative;margin:10px 0}
.slider b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px}
.slider u{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.meter{height:6px;border-radius:9px;background:var(--hover);overflow:hidden}
.meter b{display:block;height:100%;border-radius:9px;background:var(--accent)}
.divider{height:1px;background:var(--line);border:0;margin:0}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs a{padding:9px 1px;margin-bottom:-1px;color:var(--ink-3);font-size:13.5px;border-bottom:2px solid transparent}
.tabs a.on{color:var(--ink);font-weight:500;border-color:var(--ink)}
.tabs a span{color:var(--ink-3);font-weight:400;margin-left:3px}
.sectionhead{display:flex;align-items:center;gap:8px;margin:32px 0 10px;font-size:13px;color:var(--ink-3)}
.sectionhead a:hover{color:var(--ink)}

/* Composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-2);padding:14px 12px 10px}
.composer.flat{box-shadow:var(--sh-1);border-radius:16px;padding:10px 10px 8px}
.composer-in{min-height:46px;padding:2px 6px;color:var(--ink-3);font-size:15px;line-height:23px}
.composer.flat .composer-in{min-height:30px;font-size:14px}
.composer.flat .tool{padding:0 7px}
.composer-row{display:flex;align-items:center;gap:6px}
.tool{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool i{font-size:15px}
.tool.bordered{border:1px solid var(--line)}
.send{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:17px;flex:none}
.send.off{opacity:.38}

/* Home */
.home{max-width:760px;margin:0 auto;padding:9vh 32px 80px;display:flex;flex-direction:column;gap:22px}
.greet{display:flex;align-items:center;justify-content:center;gap:14px;font:400 40px/48px var(--serif);letter-spacing:-.015em;margin-bottom:6px}
.today{padding:22px 24px 8px}
.today-top{display:flex;align-items:center;gap:16px}
.today h2{font:400 27px/34px var(--serif);letter-spacing:-.01em}
.split{display:flex;gap:2px;height:6px;margin:18px 0 6px;border-radius:9px;overflow:hidden}
.split i{display:block;background:var(--hover)}
.today-legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-3);padding-bottom:14px}
.today-legend b{font-weight:500;color:var(--ink-2)}
.list-row{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 10px;margin:0 -10px;border-radius:10px;color:var(--ink)}
.list-row:hover{background:var(--hover)}
.today-foot{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);margin-top:6px}
.glance{display:grid;grid-template-columns:repeat(3,auto) minmax(0,1fr);gap:28px;align-items:center;padding:4px 4px}
.glance b{display:block;font:400 22px/26px var(--serif)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--c));grid-auto-columns:var(--c);gap:var(--g)}
.heat i{display:block;border-radius:2.5px;background:var(--h0)}
.heat i.t{box-shadow:0 0 0 1.5px var(--ink)}
.banner{display:inline-flex;align-self:center;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);font-size:13.5px}
.banner .btn{height:28px;border-radius:999px;padding:0 11px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Decks */
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.deck-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.deck-card{display:flex;flex-direction:column;gap:6px;min-height:158px;padding:18px 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .12s,box-shadow .12s}
.deck-card:hover,.deck-card.hov{border-color:var(--line-2);box-shadow:var(--sh-1)}
.deck-card h3{font:500 15px/21px var(--sans)}
.deck-card .sp{min-height:6px}
.deck-card .foot{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3);height:30px}
.deck-card .foot .btn{opacity:0}
.deck-card:hover .foot .btn,.deck-card.hov .foot .btn{opacity:1}
.cnt{display:inline-flex;align-items:center;gap:5px}

/* Deck detail */
.deck-layout{display:grid;grid-template-columns:minmax(0,1fr) 332px;gap:36px;max-width:1160px;margin:0 auto;padding:36px 48px 80px}
.card-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:18px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:start;font-size:13.5px;line-height:20px}
.card-row .q{color:var(--ink)} .card-row .a{color:var(--ink-2)}
.rail-box{padding:16px 18px;margin-bottom:12px}
.rail-box h3{font:500 13.5px/20px var(--sans);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;font-size:13px;color:var(--ink-3)}
.kv b{font-weight:500;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:2px;height:var(--bh,56px)}
.bars i{flex:1;display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars i.dim{background:var(--line-2)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:5px;border-top:1px solid var(--line);padding-top:5px}

/* Side panel (artifact-style) */
.split-view{display:grid;grid-template-columns:minmax(0,1fr) var(--panel,460px);height:100%}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:20px}
.panel-foot{padding:10px 12px;border-top:1px solid var(--line)}
.panel.float{margin:12px 12px 12px 0;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);overflow:hidden}

/* Study */
.study{display:flex;flex-direction:column;height:100vh;min-height:0}
.study-top{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;flex:none}
.study-prog{height:2px;background:var(--line);flex:none}
.study-prog b{display:block;height:100%;background:var(--accent)}
.study-mid{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:9vh 40px 24px}
.study-card{max-width:720px;width:100%;text-align:center}
.q-text{font:400 var(--qs,34px)/1.3 var(--serif);letter-spacing:-.008em}
.q-text b{font-weight:600}
.a-rule{width:48px;height:1px;background:var(--line-2);margin:34px auto}
.a-text{font:400 25px/1.42 var(--serif);color:var(--ink-2)}
.dock-wrap{padding:0 24px 14px;flex:none}
.dock{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-2);padding:8px}
.dock .show{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:13px;background:var(--ink);color:var(--on-ink);font-weight:500;font-size:15px}
.dock .show kbd{background:rgba(255,255,255,.16);color:inherit}
[data-theme=dark] .dock .show kbd{background:rgba(0,0,0,.14)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:66px;padding-bottom:6px;border-radius:13px;position:relative;font-weight:500;font-size:14.5px}
.grade:hover{background:var(--hover)}
.grade small{font-weight:400;font-size:12px;color:var(--ink-3)}
.grade em{position:absolute;right:8px;top:7px;font:500 11px/1 var(--sans);color:var(--ink-3)}
.grade u{position:absolute;left:0;right:0;bottom:6px;margin:auto;width:18px;height:2.5px;border-radius:9px}
.grade.rec{background:var(--hover)}
.dock-meta{display:flex;align-items:center;max-width:720px;margin:8px auto 0;padding:0 6px;font-size:12.5px;color:var(--ink-3);gap:14px}
.dock-meta button{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3)}
.dock-meta button[disabled]{opacity:.5}
.explain p{font:400 16.5px/1.55 var(--serif);color:var(--ink);margin-bottom:13px}
.done{max-width:520px;margin:auto;text-align:center;padding:40px 20px}
.segbar{display:flex;gap:2px;height:30px;border-radius:7px;overflow:hidden;margin:26px 0 12px}
.segbar i{display:block}
.legend{display:flex;justify-content:center;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend u{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Cards */

const SCREENS={system:['Design language',system],home:['Home A: study first (recommended)',homeA],'home-b':['Home B: composer first',homeB],'home-done':['Home: all caught up',homeDone],'home-new':['Home: first run',homeNew],study:['Study: question',study],'study-back':['Study: answer',studyBack],'study-explain':['Study: Explain panel',studyExplain],'study-done':['Study: complete',studyDone],decks:['Decks: cards',decks],'decks-list':['Decks: list',decksList],deck:['Deck page',deck],'deck-menu':['Deck actions menu',deckMenu],'deck-settings':['Deck study settings',deckSettings],cards:['Cards',cards],'cards-bulk':['Cards: bulk select',cardsBulk],create:['Create',create],'create-thread':['Create: conversation',createThread],import:['Import dialog',importDlg],cram:['Cram',cram],'cram-new':['Cram: new plan',cramNew],'cram-detail':['Cram: plan',cramDetail],'cram-study':['Cram: session',cramStudy],community:['Community (sample decks)',community],'community-preview':['Community: preview',communityPreview],insights:['Insights',insights],settings:['Settings: account',settings],appearance:['Settings: appearance',appearance],'study-settings':['Settings: study',studySettings],usage:['Settings: usage and billing',usage],connections:['Settings: connections',connections],search:['Search',searchScreen],menus:['Account menu',menus],login:['Sign in',login],onboarding:['Onboarding',onboarding],landing:['Marketing home',landing]};
function render(){const [k,q='']=location.hash.slice(1).split('?');const key=SCREENS[k]?k:'home';const p=new URLSearchParams(q);const r=document.documentElement;if(p.get('theme'))r.dataset.theme=p.get('theme');if(p.get('accent'))r.dataset.accent=p.get('accent');if(p.has('capture'))document.body.classList.add('capture');
 document.getElementById('app').innerHTML=SCREENS[key][1]();const s=document.getElementById('pick');s.value=key;document.title=`DeepHaus · ${SCREENS[key][0]}`}
document.getElementById('pick').innerHTML=Object.entries(SCREENS).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join('');
document.getElementById('pick').onchange=e=>location.hash=e.target.value;
document.getElementById('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
document.getElementById('ac').onclick=()=>{const r=document.documentElement;r.dataset.accent=r.dataset.accent==='clay'?'teal':'clay'};
addEventListener('hashchange',render);render();
const tip=document.getElementById('tip');addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const v=t&&t.getAttribute('data-tip');if(v){tip.textContent=v;tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-30+'px'}else tip.style.display='none'});
</script></body></html>
