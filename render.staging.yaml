# Separate staging workers. Creating this Blueprint provisions paid services.
# Enter staging credentials only; use manual deploys of the reviewed release commit.
services:
  - type: worker
    name: deephaus-staging-anki-worker
    runtime: docker
    repo: https://github.com/lkyne7/deephaus
    branch: codex/release-environment-setup
    region: virginia # closest to the Supabase project (us-east-1)
    plan: standard # 2 GB RAM; sql.js needs headroom for large collections
    dockerfilePath: ./apps/anki-worker/Dockerfile
    dockerContext: . # build from the monorepo root
    autoDeployTrigger: "off"
    disk:
      name: staging-anki-scratch
      mountPath: /data # scratch space for streaming multi-GB packages to disk
      sizeGB: 20
    envVars:
      - key: SUPABASE_URL
        value: https://cktvxmclcxtymkozciaw.supabase.co
      - key: ANKI_WORKER_TMPDIR
        value: /data
      - key: ANKI_WORKER_POLL_MS
        value: "5000"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # entered in the Render dashboard, not stored in git

  - type: worker
    name: deephaus-staging-extraction-worker
    runtime: docker
    repo: https://github.com/lkyne7/deephaus
    branch: codex/release-environment-setup
    region: virginia
    plan: standard
    dockerfilePath: ./apps/extraction-worker/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    disk:
      name: staging-extraction-scratch
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: SUPABASE_URL
        value: https://cktvxmclcxtymkozciaw.supabase.co
      - key: APP_BASE_URL
        value: https://deephaus-staging.vercel.app
      - key: EXTRACTION_WORKER_TMPDIR
        value: /data
      - key: EXTRACTION_WORKER_POLL_MS
        value: "3000"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_OCR_MODEL
        value: mistral-ocr-4-0
      - key: EXTRACTION_WORKER_SECRET
        sync: false
