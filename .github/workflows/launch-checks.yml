name: Launch checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' -r build
      - run: pnpm --filter @deephaus/web typecheck
      - run: pnpm --filter @deephaus/mobile typecheck
      - run: pnpm --filter @deephaus/extraction-worker typecheck
      - run: pnpm --filter @deephaus/web lint
      - run: pnpm --filter @deephaus/web test
      - run: pnpm --filter @deephaus/extraction-worker test
      - run: pnpm --filter @deephaus/local-db test
      - run: pnpm test:launch
      - run: pnpm typecheck:e2e
