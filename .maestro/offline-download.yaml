appId: ${APP_ID}
---
# Uses the signed-in isolated native fixture after launch:maestro.
- launchApp
- openLink: "deephaus-staging://"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- openLink: "deephaus-staging://profile"
- scrollUntilVisible:
    element: "Check downloads"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: "Downloaded"
    timeout: 60000
- assertVisible: ".*1/1 images.*"
- scrollUntilVisible:
    element: "Pause downloads"
    direction: DOWN
    timeout: 60000
- tapOn: "Pause downloads"
- assertVisible: "Downloads paused"
- openLink: "deephaus-staging://"
- assertNotVisible: "Resume downloads"
- openLink: "deephaus-staging://profile"
- scrollUntilVisible:
    element: "Resume downloads"
    direction: DOWN
    timeout: 60000
- assertVisible: "Downloads paused"
- tapOn: "Resume downloads"
- tapOn: "Check downloads"
- extendedWaitUntil:
    visible: "Downloaded"
    timeout: 30000
- takeScreenshot: offline-settings
- openLink: "deephaus-staging://"
- assertNotVisible: "Pause downloads"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*${E2E_DECK_NAME}.*"
    timeout: 30000
- openLink: "deephaus-staging://profile"
- scrollUntilVisible:
    element: "Check downloads"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: "Downloaded"
    timeout: 60000
- assertVisible: ".*1/1 images.*"
- openLink: "deephaus-staging://"
- extendedWaitUntil:
    visible: ".*${E2E_DECK_NAME}.*"
    timeout: 30000
- openLink: "deephaus-staging://study/${E2E_DECK_ID}"
- extendedWaitUntil:
    visible: "(?s).*Launch native question.*Offline study fixture.*"
    timeout: 30000
- assertVisible: "Show Answer"
