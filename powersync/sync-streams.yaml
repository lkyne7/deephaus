# PowerSync Sync Streams for DeepHaus.
#
# Deploy via the PowerSync Dashboard (Sync Streams view) or the CLI.
# Mirrors RLS: each user syncs only their own rows. Tables keyed on user_id
# are aliased so the client-side row id is stable.

config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM projects WHERE user_id = auth.user_id()
      # Metadata only: clients need these columns for deck/card joins, while
      # raw_text and edited_content would add tens of MB to every replica (large
      # enough for iOS to terminate the app on startup). Source bodies stay
      # server-side, so document reads and edits require a connection.
      - SELECT id, project_id, type, storage_path, page_count, created_at,
          content_edited_at, title, extract_images, preview_storage_path,
          external_url, user_id, parent_id, position, icon, is_favorite, updated_at
        FROM sources
        WHERE user_id = auth.user_id()
      - SELECT generation_jobs.*
        FROM generation_jobs
        INNER JOIN sources ON generation_jobs.source_id = sources.id
        WHERE sources.user_id = auth.user_id()
      - SELECT cards.*
        FROM cards
        INNER JOIN generation_jobs ON cards.job_id = generation_jobs.id
        INNER JOIN sources ON generation_jobs.source_id = sources.id
        WHERE sources.user_id = auth.user_id()
      - SELECT * FROM card_reviews WHERE user_id = auth.user_id()
      - SELECT * FROM review_logs WHERE user_id = auth.user_id()
      - SELECT * FROM cram_plans WHERE user_id = auth.user_id()
      - SELECT cram_plan_deck_profiles.*
        FROM cram_plan_deck_profiles
        INNER JOIN cram_plans ON cram_plan_deck_profiles.plan_id = cram_plans.id
        WHERE cram_plans.user_id = auth.user_id()
      - SELECT cram_plan_items.*
        FROM cram_plan_items
        INNER JOIN cram_plans ON cram_plan_items.plan_id = cram_plans.id
        WHERE cram_plans.user_id = auth.user_id()
      - SELECT * FROM cram_review_logs WHERE user_id = auth.user_id()
      # Explicit column lists: `user_id AS id, *` would let a future `id` column
      # on these tables silently overwrite the alias and corrupt client row ids
      # (PowerSync flags this as a deploy warning).
      - SELECT user_id AS id, user_id, desired_retention, new_cards_per_day,
          day_start_hour, timezone, updated_at
        FROM user_study_settings
        WHERE user_id = auth.user_id()
      - SELECT user_id AS id, user_id, params, log_count, optimized_at, updated_at
        FROM user_fsrs_params
        WHERE user_id = auth.user_id()
      - SELECT user_id AS id, user_id, username, full_name, avatar_url,
          university_name, university_domain, university_email,
          university_email_verified_at, created_at, updated_at
        FROM user_profiles
        WHERE user_id = auth.user_id()
